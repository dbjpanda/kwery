# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Kwery's documentation is plain Markdown written to be readable on GitHub, so
# this builds with MkDocs rather than Sphinx: MkDocs resolves `caching.md`
# style links to site URLs on its own, which is what keeps the same files
# readable in both places without a second set of link syntax.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml
  # A broken link or a page missing from the nav fails the build rather than
  # publishing a site with a dead link in it. Documentation that lies is the
  # failure mode this project keeps finding, so it gets the same treatment as
  # a failing test.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
