[versions]
# Managed by release-please: it reads the Conventional Commits since the last
# release, works out the next version and bumps this line in the Release PR.
# Do not edit it by hand — the marker comment is how the tool finds it.
#
# This holds the LAST RELEASED version rather than a -SNAPSHOT, which is the
# release-please convention: the bump and the tag happen together when the
# Release PR merges, so there is no window where the branch claims a version
# that was never cut.
#
# Pre-1.0: the API may still change, and apiCheck makes every change to it a
# reviewed diff rather than a surprise.
kwery = "0.3.2" # x-release-please-version
kotlin = "2.2.20"
coroutines = "1.10.2"
serialization = "1.9.0"
retrofit = "2.11.0"   # 3.x pulls okhttp 5, which needs compileSdk 37; this project is pinned to 36
okhttp = "4.12.0"
retrofitSerialization = "1.0.0"
chucker = "4.3.1"
bcv = "0.18.1"
# Handles POM, sources, javadoc, signing and Central Portal upload in one task,
# replacing about forty lines of hand-rolled publishing config.
mavenPublish = "0.33.0"

# Android. Verified by building: Gradle 9.5.1 + AGP 8.13.2 is the newest
# combination where the classic Kotlin plugin, KSP (Room codegen) and
# binary-compatibility-validator all work. See CLAUDE.md.
agp = "8.13.2"
ksp = "2.2.20-2.0.4"
compileSdk = "36"
minSdk = "24"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
datastore = "1.2.1"
room = "2.8.4"
sqlite = "2.6.2"

# Library consumers compile against this. Kept at 11 rather than 17 so Kwery is
# usable from Android modules and older JVM projects; the toolchain used to
# *build* it is 17.
jvmTarget = "11"
jdkToolchain = "17"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Sample app only. Kwery itself depends on no HTTP client: it calls whatever
# function you hand it, which is the point the sample now demonstrates on screen.
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }
chucker-noop = { module = "com.github.chuckerteam.chucker:library-no-op", version.ref = "chucker" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
# 2.10.0 deliberately, not 2.11.0: androidx.lifecycle is an atomic group, so
# requesting 2.11.0 drags lifecycle-runtime-compose 2.11.0 in transitively, and
# that artifact hard-requires AGP 9.1+.
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Instrumentation only. These tests exist for the handful of behaviours a JVM
# test cannot reach: real ConnectivityManager capabilities, real file paths, and
# code that has been through R8.
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-rules = { module = "androidx.test:rules", version = "1.7.0" }
androidx-test-core = { module = "androidx.test:core-ktx", version = "1.7.0" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Room on the JVM needs a driver: the bundled one ships its own SQLite, so
# tests run without a device or Robolectric.
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
