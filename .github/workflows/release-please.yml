# Keeps a Release PR open that accumulates every change since the last release,
# derives the next version from Conventional Commits, and writes the CHANGELOG.
# Merging that PR cuts the release — and publishes it, in the job below.
#
# The publish job lives HERE rather than in its own workflow triggered by
# `on: release`, because GitHub does not trigger workflows from events created
# with GITHUB_TOKEN. A release-please release is authored by github-actions[bot],
# so a separate `on: release` workflow never fires — it does not fail, it simply
# never runs, which is a considerably worse way to find out. Chaining off the
# action's own output avoids the problem without needing a PAT.
name: Release Please

on:
  push:
    branches: [main]
  # Lets an existing tag be published again without cutting a new version. A
  # failed upload is not a reason to burn a version number, and on an immutable
  # registry burning one is not free.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # always() because release-please is skipped on a manual dispatch, and a
    # skipped dependency would otherwise skip this too.
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Publishing is automatic, so an upload is permanent the moment it
      # succeeds. The tag is the thing being published and has to agree with the
      # version the build stamps on the artifacts — a v0.2.0 tag publishing
      # artifacts labelled 0.1.1 cannot be taken back.
      - name: Tag and build version must match
        run: |
          BUILD=$(grep -E '^kwery = ' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG build=$BUILD"
          if [ "$TAG" != "v$BUILD" ]; then
            echo "::error::Tag $TAG does not match version $BUILD in libs.versions.toml"
            exit 1
          fi
          case "$BUILD" in
            *SNAPSHOT*) echo "::error::Refusing to publish a snapshot"; exit 1 ;;
          esac

      # A failing test discovered after publication has no remedy, so the whole
      # suite and the API check run before the upload rather than beside it.
      - name: Verify
        run: ./gradlew build apiCheck --no-daemon

      # --no-configuration-cache is required, not tidiness: the publish task
      # cannot be serialized into the configuration cache, and this build turns
      # that cache on globally in gradle.properties. The plugin fails with a
      # clear message rather than publishing something wrong, but it does fail.
      # See gradle/gradle#22779.
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
