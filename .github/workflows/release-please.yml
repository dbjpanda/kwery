# Keeps a Release PR open that accumulates every change since the last release,
# derives the next version from Conventional Commits, and writes the CHANGELOG.
# Merging that PR is what cuts a release: it tags, and the tag triggers publish.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
